# PostgreSQL Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-backup
  namespace: ankiya-cloud
  labels:
    app: postgresql-backup
    app.kubernetes.io/part-of: ankiya-platform
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 3600  # 1 hour timeout
      template:
        metadata:
          labels:
            app: postgresql-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  
                  # Variables
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="backup_${TIMESTAMP}.sql.gz"
                  BACKUP_PATH="/backups/${BACKUP_FILE}"
                  
                  echo "=== PostgreSQL Backup Started ==="
                  echo "Timestamp: ${TIMESTAMP}"
                  echo "Backup file: ${BACKUP_FILE}"
                  
                  # Create backup directory if not exists
                  mkdir -p /backups
                  
                  # Perform backup with compression
                  echo "Creating database backup..."
                  PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
                    -h postgresql-service \
                    -U "${POSTGRES_USER}" \
                    -d "${POSTGRES_DB}" \
                    --format=plain \
                    --no-owner \
                    --no-acl \
                    --verbose \
                    | gzip > "${BACKUP_PATH}"
                  
                  # Verify backup
                  if [ -s "${BACKUP_PATH}" ]; then
                    BACKUP_SIZE=$(du -h "${BACKUP_PATH}" | cut -f1)
                    echo "Backup created successfully: ${BACKUP_FILE} (${BACKUP_SIZE})"
                  else
                    echo "ERROR: Backup file is empty!"
                    exit 1
                  fi
                  
                  # Upload to MinIO
                  echo "Uploading to MinIO..."
                  mc alias set minio http://minio-service:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
                  mc cp "${BACKUP_PATH}" minio/backups/postgresql/
                  
                  # Verify upload
                  if mc ls minio/backups/postgresql/${BACKUP_FILE} > /dev/null 2>&1; then
                    echo "Backup uploaded to MinIO successfully"
                  else
                    echo "WARNING: Failed to verify MinIO upload"
                  fi
                  
                  # Cleanup old local backups (keep last 3)
                  echo "Cleaning up old local backups..."
                  ls -tp /backups/*.sql.gz 2>/dev/null | tail -n +4 | xargs -I {} rm -- {} 2>/dev/null || true
                  
                  # Cleanup old MinIO backups (keep last 30)
                  echo "Cleaning up old MinIO backups..."
                  mc rm --older-than 30d minio/backups/postgresql/ 2>/dev/null || true
                  
                  echo "=== PostgreSQL Backup Completed ==="
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: ankiya-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ankiya-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: ankiya-secrets
                      key: POSTGRES_DB
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: ankiya-secrets
                      key: MINIO_ROOT_USER
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ankiya-secrets
                      key: MINIO_ROOT_PASSWORD
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc
---
# PVC for temporary backup storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: ankiya-cloud
  labels:
    app: postgresql-backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Weekly full backup with more retention
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-backup-weekly
  namespace: ankiya-cloud
  labels:
    app: postgresql-backup
    type: weekly
spec:
  schedule: "0 3 * * 0"  # Sundays at 3 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 7200  # 2 hour timeout
      template:
        metadata:
          labels:
            app: postgresql-backup
            type: weekly
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="weekly_backup_${TIMESTAMP}.sql.gz"
                  
                  echo "=== Weekly Full Backup Started ==="
                  
                  mkdir -p /backups
                  
                  # Full backup with all schemas
                  PGPASSWORD="${POSTGRES_PASSWORD}" pg_dumpall \
                    -h postgresql-service \
                    -U "${POSTGRES_USER}" \
                    --verbose \
                    | gzip > "/backups/${BACKUP_FILE}"
                  
                  # Upload to MinIO with weekly retention path
                  mc alias set minio http://minio-service:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
                  mc cp "/backups/${BACKUP_FILE}" minio/backups/postgresql/weekly/
                  
                  # Cleanup weekly backups older than 90 days
                  mc rm --older-than 90d minio/backups/postgresql/weekly/ 2>/dev/null || true
                  
                  echo "=== Weekly Backup Completed ==="
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: ankiya-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ankiya-secrets
                      key: POSTGRES_PASSWORD
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: ankiya-secrets
                      key: MINIO_ROOT_USER
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ankiya-secrets
                      key: MINIO_ROOT_PASSWORD
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
              resources:
                limits:
                  cpu: 1000m
                  memory: 1Gi
                requests:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc
