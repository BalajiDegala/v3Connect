# MinIO Deployment for Logs Storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: ankiya-cloud
  labels:
    app: minio
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: ankiya-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate  # Required for single-replica with PVC
  template:
    metadata:
      labels:
        app: minio
        app.kubernetes.io/name: minio
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/minio/v2/metrics/cluster"
    spec:
      serviceAccountName: ankiya-service-account
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-08-29T01-40-52Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: "public"
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
---
# MinIO Service
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: ankiya-cloud
  labels:
    app: minio
    app.kubernetes.io/name: minio
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      name: api
    - port: 9001
      targetPort: 9001
      name: console
  selector:
    app: minio
---
# MinIO LoadBalancer Service (for console access)
apiVersion: v1
kind: Service
metadata:
  name: minio-console-lb
  namespace: ankiya-cloud
  labels:
    app: minio
spec:
  type: LoadBalancer
  ports:
    - port: 9001
      targetPort: 9001
      name: console
  selector:
    app: minio
---
# MinIO Init Job - Creates buckets
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-buckets
  namespace: ankiya-cloud
  labels:
    app: minio-init
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: MINIO_ROOT_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for MinIO to be ready..."
              sleep 30
              
              # Configure mc
              mc alias set ankiya http://minio-service:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD
              
              # Create buckets
              mc mb ankiya/ankiya-logs --ignore-existing
              mc mb ankiya/ankiya-backups --ignore-existing
              mc mb ankiya/ankiya-uploads --ignore-existing
              
              # Set lifecycle policies (expire logs after 90 days)
              mc ilm rule add ankiya/ankiya-logs --expire-days 90 --noncurrent-expire-days 30
              
              echo "MinIO buckets created successfully!"
