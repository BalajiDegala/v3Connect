apiVersion: v2
name: ankiya-cloud
description: A Helm chart for Ankiya Cloud Platform - Multi-tenant VFX Studio Management
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - ankiya
  - vfx
  - cloud
  - kubernetes
  - multi-tenant
home: https://ankiyacloud.com
sources:
  - https://github.com/ankiya/ankiya-cloud
maintainers:
  - name: Ankiya Team
    email: team@ankiyacloud.com
dependencies:
  - name: postgresql
    version: "~18.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "~24.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: keycloak
    version: "~24.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: keycloak.enabled
  - name: minio
    version: "~17.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: minio.enabled
