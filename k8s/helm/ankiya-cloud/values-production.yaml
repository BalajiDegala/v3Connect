# Production environment overrides
# Usage: helm install ankiya ./ankiya-cloud -f values.yaml -f values-production.yaml

global:
  domain: ankiya.example.com  # UPDATE THIS
  storageClass: "longhorn"    # Or your production storage class

frontend:
  replicaCount: 3
  
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  autoscaling:
    minReplicas: 3
    maxReplicas: 10

backend:
  replicaCount: 5
  
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  
  autoscaling:
    minReplicas: 5
    maxReplicas: 20

postgresql:
  primary:
    persistence:
      size: 100Gi
    
    resources:
      limits:
        cpu: 4000m
        memory: 8Gi
      requests:
        cpu: 1000m
        memory: 2Gi

redis:
  master:
    persistence:
      size: 20Gi
    
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
  
  replica:
    replicaCount: 3
    persistence:
      size: 20Gi

keycloak:
  replicaCount: 3
  
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

minio:
  persistence:
    size: 500Gi

monitoring:
  prometheus:
    retention: 30d
    persistence:
      size: 200Gi
    
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
  
  loki:
    retention: 90d
    persistence:
      size: 200Gi

ingress:
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "200"
    nginx.ingress.kubernetes.io/limit-connections: "100"
