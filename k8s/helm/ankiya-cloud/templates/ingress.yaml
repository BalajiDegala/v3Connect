{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ankiya-cloud.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ankiya-cloud.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.frontend }}
        - {{ .Values.ingress.hosts.backend }}
        - {{ .Values.ingress.hosts.keycloak }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    # Frontend
    - host: {{ .Values.ingress.hosts.frontend }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ankiya-cloud.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
    # Backend API
    - host: {{ .Values.ingress.hosts.backend }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ankiya-cloud.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
    {{- if .Values.keycloak.enabled }}
    # Keycloak
    - host: {{ .Values.ingress.hosts.keycloak }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-keycloak
                port:
                  number: 8080
    {{- end }}
{{- if .Values.monitoring.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ankiya-cloud.fullname" . }}-monitoring
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ankiya-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: monitoring-basic-auth
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.grafana }}
      secretName: {{ .Values.ingress.tls.secretName }}-monitoring
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.grafana }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
{{- end }}
{{- end }}
