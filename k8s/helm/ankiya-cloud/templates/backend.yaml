{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ankiya-cloud.fullname" . }}-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ankiya-cloud.backend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ankiya-cloud.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ankiya-cloud.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "ankiya-cloud.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: backend
          image: "{{ .Values.global.imageRegistry }}{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.backend.env.NODE_ENV | quote }}
            - name: PORT
              value: "5000"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "ankiya-secrets" }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "ankiya-secrets" }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "ankiya-secrets" }}
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: {{ include "ankiya-cloud.databaseUrl" . | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "ankiya-secrets" }}
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: {{ include "ankiya-cloud.redisUrl" . | quote }}
            - name: KEYCLOAK_URL
              value: {{ include "ankiya-cloud.keycloakUrl" . | quote }}
            - name: KEYCLOAK_REALM
              value: "ankiya"
            - name: KEYCLOAK_CLIENT_ID
              value: "ankiya-backend"
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "ankiya-secrets" }}
                  key: KEYCLOAK_CLIENT_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "ankiya-secrets" }}
                  key: JWT_SECRET
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "ankiya-secrets" }}
                  key: RAZORPAY_KEY_ID
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "ankiya-secrets" }}
                  key: RAZORPAY_KEY_SECRET
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "ankiya-secrets" }}
                  key: SMTP_HOST
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "ankiya-secrets" }}
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "ankiya-secrets" }}
                  key: SMTP_PASS
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ankiya-cloud.fullname" . }}-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ankiya-cloud.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ankiya-cloud.backend.selectorLabels" . | nindent 4 }}
{{- if .Values.backend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ankiya-cloud.fullname" . }}-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ankiya-cloud.backend.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ankiya-cloud.fullname" . }}-backend
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
