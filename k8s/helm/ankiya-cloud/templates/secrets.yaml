{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: ankiya-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ankiya-cloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_USER: {{ .Values.postgresql.auth.username | default "ankiya_admin" | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | default (randAlphaNum 24) | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | default "ankiya_cloud" | quote }}
  
  # Redis
  REDIS_PASSWORD: {{ .Values.redis.auth.password | default (randAlphaNum 24) | quote }}
  
  # Keycloak
  KEYCLOAK_ADMIN: {{ .Values.keycloak.auth.adminUser | default "admin" | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.keycloak.auth.adminPassword | default (randAlphaNum 24) | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.keycloak.clientSecret | default (randAlphaNum 32) | quote }}
  
  # MinIO
  MINIO_ROOT_USER: {{ .Values.minio.auth.rootUser | default "minioadmin" | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.auth.rootPassword | default (randAlphaNum 24) | quote }}
  
  # Razorpay
  RAZORPAY_KEY_ID: {{ .Values.secrets.razorpayKeyId | default "rzp_test_placeholder" | quote }}
  RAZORPAY_KEY_SECRET: {{ .Values.secrets.razorpayKeySecret | default "placeholder" | quote }}
  RAZORPAY_WEBHOOK_SECRET: {{ .Values.secrets.razorpayWebhookSecret | default "placeholder" | quote }}
  
  # SMTP
  SMTP_HOST: {{ .Values.secrets.smtpHost | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | quote }}
  SMTP_PASS: {{ .Values.secrets.smtpPass | quote }}
  
  # JWT
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default (randAlphaNum 64) | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | default (randAlphaNum 64) | quote }}
{{- end }}
