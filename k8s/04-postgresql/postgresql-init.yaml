# PostgreSQL Init Job - Creates initial schema and seed data
apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-init
  namespace: ankiya-cloud
  labels:
    app: postgresql-init
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: "postgresql-service"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: POSTGRES_DB
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until pg_isready -h $PGHOST -p $PGPORT -U $PGUSER; do
                sleep 2
              done
              
              echo "PostgreSQL is ready. Running initialization..."
              
              # Create extensions
              psql -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
              psql -c "CREATE EXTENSION IF NOT EXISTS \"pg_trgm\";"
              
              echo "Database initialization complete!"
