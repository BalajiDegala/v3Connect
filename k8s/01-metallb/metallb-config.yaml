# MetalLB Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# MetalLB IP Address Pool
# IMPORTANT: Update the IP range to match your network
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ankiya-pool
  namespace: metallb-system
spec:
  addresses:
    # Update this range to match your available IPs
    - 192.168.1.240-192.168.1.250
  autoAssign: true
---
# L2 Advertisement for the IP Pool
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: ankiya-l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - ankiya-pool
  interfaces:
    # Optional: specify interface, remove if not needed
    # - eth0
