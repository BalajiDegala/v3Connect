# Keycloak Deployment with High Availability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: ankiya-cloud
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: ankiya-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keycloak
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/name: keycloak
    spec:
      serviceAccountName: ankiya-service-account
      securityContext:
        fsGroup: 1000
      initContainers:
        # Wait for PostgreSQL to be ready
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h postgresql-service -p 5432 -U $POSTGRES_USER; do
                echo "Waiting for PostgreSQL..."
                sleep 5
              done
              echo "PostgreSQL is ready!"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: POSTGRES_PASSWORD
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          imagePullPolicy: IfNotPresent
          args:
            - start
            - --optimized
            - --http-enabled=true
            - --http-port=8080
            - --hostname-strict=false
            - --hostname-strict-https=false
            - --proxy-headers=xforwarded
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 7800
              name: jgroups
          env:
            # Admin credentials
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            # Database
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: postgresql-service
            - name: KC_DB_URL_PORT
              value: "5432"
            - name: KC_DB_URL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: POSTGRES_DB
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ankiya-secrets
                  key: POSTGRES_PASSWORD
            # Clustering with Infinispan
            - name: KC_CACHE
              value: ispn
            - name: KC_CACHE_STACK
              value: kubernetes
            - name: JAVA_OPTS_APPEND
              value: >-
                -Djgroups.dns.query=keycloak-headless.ankiya-cloud.svc.cluster.local
            # Health
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            # Logging
            - name: KC_LOG_LEVEL
              value: INFO
          volumeMounts:
            - name: keycloak-realm
              mountPath: /opt/keycloak/data/import
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/started
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: keycloak-realm
          configMap:
            name: keycloak-realm-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: keycloak
                topologyKey: kubernetes.io/hostname
---
# Keycloak Headless Service (for clustering)
apiVersion: v1
kind: Service
metadata:
  name: keycloak-headless
  namespace: ankiya-cloud
  labels:
    app: keycloak
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 7800
      targetPort: 7800
      name: jgroups
  selector:
    app: keycloak
---
# Keycloak Service
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: ankiya-cloud
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: keycloak
---
# Keycloak LoadBalancer Service (MetalLB)
apiVersion: v1
kind: Service
metadata:
  name: keycloak-lb
  namespace: ankiya-cloud
  labels:
    app: keycloak
  annotations:
    metallb.universe.tf/loadBalancerIPs: ""  # Let MetalLB assign IP
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: keycloak
---
# Keycloak HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: keycloak-hpa
  namespace: ankiya-cloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: keycloak
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# Keycloak PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak-pdb
  namespace: ankiya-cloud
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: keycloak
