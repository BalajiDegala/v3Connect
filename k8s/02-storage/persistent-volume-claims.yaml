# PostgreSQL PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
  namespace: ankiya-cloud
  labels:
    app: postgresql
    app.kubernetes.io/part-of: ankiya-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ankiya-fast
  resources:
    requests:
      storage: 50Gi
---
